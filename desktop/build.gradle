plugins { id 'application' }
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
sourceSets.main.java.srcDirs = ['src/']
sourceSets.main.java.exclude 'test/**'
sourceSets.main.resources.srcDirs = ['../android/assets']
application {
    mainClass = 'com.tjstudios.mynesweeper.desktop.DesktopLauncher'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}
tasks.named('run') { workingDir = file('../android/assets') }
tasks.register('smokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.tjstudios.mynesweeper.desktop.SmokeLauncher'
    workingDir = file('../android/assets')
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    systemProperty 'smoke.image', rootProject.file('.validation/game.png').absolutePath
}
