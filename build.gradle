buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        if (gradle.startParameter.projectProperties.containsKey('android')) {
            classpath 'com.android.tools.build:gradle:9.0.1'
        }
    }
}
allprojects {
    version = '1.1'
    ext.gdxVersion = '1.14.2'
    repositories { mavenCentral(); google() }
}
