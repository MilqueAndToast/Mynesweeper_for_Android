apply plugin: 'com.android.application'
configurations { natives }
android {
    namespace = 'com.tjstudios.mynesweeper'
    compileSdk = 36
    defaultConfig {
        applicationId = 'com.tjstudios.mynesweeper'
        minSdk = 25
        targetSdk = 36
        versionCode = 4
        versionName = '1.1-preview.3'
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['src']
        res.srcDirs = ['res']
        assets.srcDirs = ['assets']
        jniLibs.srcDirs = [layout.buildDirectory.dir('generated/natives').get().asFile]
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-$abi"
    }
}
def copyNatives = tasks.register('copyAndroidNatives') {
    inputs.files(configurations.natives)
    outputs.dir(layout.buildDirectory.dir('generated/natives'))
    doLast {
        configurations.natives.files.each { jar ->
            def abi = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].find {
                jar.name.endsWith("natives-${it}.jar")
            }
            if (abi) {
                copy {
                    from zipTree(jar)
                    into layout.buildDirectory.dir("generated/natives/$abi")
                    include '*.so'
                }
            }
        }
    }
}
tasks.named('preBuild') { dependsOn copyNatives }
